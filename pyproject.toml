[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "corporate-wallet-digital-twin"
version = "3.0.0"
description = "Evidence-first corporate wallet decision support for the Standard Bank Hackathon 2026"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi==0.141.1",
  "httpx==0.28.1",
  "numpy==2.0.2",
  "openai>=1.70,<3",
  "pandas==2.3.1",
  "pypdf==6.15.0",
  "pydantic==2.11.7",
  "scipy==1.13.1",
  "starlette==1.6.0",
  "uvicorn==0.31.1",
]

[project.optional-dependencies]
dev = [
  "httpx2==2.10.0",
  "jupyter==1.1.1",
  "matplotlib==3.9.4",
  "nbconvert==7.16.6",
  "nbformat==5.10.4",
  "pytest==8.4.2",
  "pytest-cov>=5,<8",
  "reportlab>=4.4,<5",
]
genai = [
  "anthropic>=0.60,<1",
  "google-genai>=1.30,<2",
]
production = [
  "boto3>=1.35,<2",
  "confluent-kafka>=2.6,<3",
  "psycopg[binary,pool]>=3.2,<4",
  "pyjwt[crypto]>=2.9,<3",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
