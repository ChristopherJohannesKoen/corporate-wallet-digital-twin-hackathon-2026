name: v320-promotion-readiness-ci
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: astral-sh/setup-uv@v6
        with: { version: "0.9.2", enable-cache: true }
      - run: uv lock --check
      - run: uv sync --frozen --extra dev --extra genai --extra production
      - run: uv run python scripts/export_v3_contracts.py
      - run: uv run python scripts/run_v3_validation.py
      - run: uv run python scripts/export_v31_contracts.py
      # The wallet fixture is in the diff gate below, so it must actually be
      # regenerated here — otherwise the gate is inert for that artifact.
      - run: uv run python scripts/export_v311_wallet_surface.py
      - run: uv run python scripts/export_v32_contracts.py
      - run: uv run python scripts/export_v32_workbench_fixture.py
      - run: uv run python scripts/run_measurement_sensitivity.py
      - run: uv run ruff check src tests scripts
      - run: uv run pytest --cov=wallet_twin_v2 --cov=wallet_twin_v3 --cov=wallet_twin_v31 --cov=wallet_twin_v32 --cov-report=term-missing
      # V3.2 is additive: this must still pass unchanged for V3.1.1's surface.
      - run: uv run python scripts/freeze_v311_boundary.py --check
      - run: git diff --exit-code -- contracts dashboard/app/data/shadow-fixture.json dashboard/app/data/v3-fixture.json dashboard/app/data/v31-fixture.json dashboard/app/data/wallet-v311-fixture.json dashboard/app/data/promotion-fixture.json outputs/v3 outputs/v31 outputs/v32 outputs/v3_validation/v3_validation_report.json outputs/v2_validation/measurement_policy_sensitivity.json tests/regression/v3_0/v3_0_frozen_surface.restated.json
  workbench:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: dashboard } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22.14", cache: npm, cache-dependency-path: dashboard/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --pull --tag wallet-twin:${{ github.sha }} .
      - run: docker run --rm wallet-twin:${{ github.sha }} python -c "import wallet_twin_v2, wallet_twin_v3, wallet_twin_v31, wallet_twin_v32; from wallet_twin_v2.service_apps import SERVICE_ROUTES, business_twin_app, promotion_app, workbench_bff_app; assert any(route.path == '/v3/decision-twin' for route in business_twin_app.routes); assert any(route.path == '/v3/coverage-plan' for route in workbench_bff_app.routes); assert len(SERVICE_ROUTES) == 12; assert any(route.path == '/v3/promotion/state' for route in promotion_app.routes)"
      - run: docker run --detach --name wallet-twin-smoke --publish 18080:8080 wallet-twin:${{ github.sha }}
      # Readiness polling and assertions are separated inside the script: a
      # failed assertion fails once, loudly, instead of being retried twenty
      # times and reported as a timeout.
      - run: docker exec -i wallet-twin-smoke python - < scripts/container_smoke.py
      - if: failure()
        run: docker logs wallet-twin-smoke
      - if: always()
        run: docker rm --force wallet-twin-smoke || true
      - uses: anchore/sbom-action@v0
        with: { image: "wallet-twin:${{ github.sha }}", format: spdx-json, output-file: sbom.spdx.json }
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: "wallet-twin:${{ github.sha }}"
          severity: "CRITICAL,HIGH"
          exit-code: "1"
          ignore-unfixed: true
      # Bank CI must additionally sign and attest the promoted artifact.
  # The bank-shaped lab. These assertions cannot be made against a stub: the
  # OPA/Python divergence that V3.2 found existed precisely because the policy
  # engine had never actually been consulted.
  bank-lab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: astral-sh/setup-uv@v6
        with: { version: "0.9.2", enable-cache: true }
      - run: uv sync --frozen --extra dev --extra production
      - run: docker compose -f infra/local/docker-compose.yml up -d
      # The bootstrap verifies its own work — it writes an object to a locked
      # bucket and confirms permanent deletion is refused. A non-zero exit means
      # object lock did not take effect, which cannot be fixed after the fact
      # because --with-lock is only honoured at bucket creation.
      - run: |
          docker compose -f infra/local/docker-compose.yml wait minio-bootstrap
          container_id="$(docker compose -f infra/local/docker-compose.yml ps -q minio-bootstrap)"
          test -n "$container_id"
          test "$(docker inspect "$container_id" --format '{{.State.ExitCode}}')" = "0"
      - run: uv run pytest -m bank_lab -q
      - run: |
          curl --fail --retry 20 --retry-delay 2 http://127.0.0.1:18110/health
          curl --fail --retry 20 --retry-delay 2 http://127.0.0.1:18080/health
          test "$(curl --silent 'http://127.0.0.1:8088/mock/feeds/daily?as_of=2026-06-30' | python -c 'import json,sys; print(json.load(sys.stdin)["row_count"])')" = "100"
      # The divergence log must be empty. A non-empty one means the Rego and the
      # in-process policy have drifted and the system is deciding things nobody
      # decided.
      - run: uv run python scripts/check_policy_agreement.py
      - if: failure()
        run: docker compose -f infra/local/docker-compose.yml logs
      - if: always()
        run: docker compose -f infra/local/docker-compose.yml down -v

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
