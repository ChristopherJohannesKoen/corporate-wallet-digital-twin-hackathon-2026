name: v31-decision-twin-ci
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: astral-sh/setup-uv@v6
        with: { version: "0.9.2", enable-cache: true }
      - run: uv lock --check
      - run: uv sync --frozen --extra dev --extra genai --extra production
      - run: uv run python scripts/export_v3_contracts.py
      - run: uv run python scripts/run_v3_validation.py
      - run: uv run python scripts/export_v31_contracts.py
      - run: uv run ruff check src tests scripts
      - run: uv run pytest --cov=wallet_twin_v2 --cov=wallet_twin_v3 --cov=wallet_twin_v31 --cov-report=term-missing
      - run: git diff --exit-code -- contracts dashboard/app/data/shadow-fixture.json dashboard/app/data/v3-fixture.json dashboard/app/data/v31-fixture.json outputs/v3 outputs/v31 outputs/v3_validation/v3_validation_report.json tests/regression/v3_0/v3_0_frozen_surface.json
  workbench:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: dashboard } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22.14", cache: npm, cache-dependency-path: dashboard/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --pull --tag wallet-twin:${{ github.sha }} .
      - run: docker run --rm wallet-twin:${{ github.sha }} python -c "import wallet_twin_v2, wallet_twin_v3, wallet_twin_v31; from wallet_twin_v2.service_apps import business_twin_app, workbench_bff_app; assert any(route.path == '/v3/decision-twin' for route in business_twin_app.routes); assert any(route.path == '/v3/coverage-plan' for route in workbench_bff_app.routes)"
      - run: docker run --detach --name wallet-twin-smoke --publish 18080:8080 wallet-twin:${{ github.sha }}
      - run: |
          for attempt in $(seq 1 20); do
            if docker exec wallet-twin-smoke python -c "import json,urllib.request; assert json.load(urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2))['version'] == '3.1.0'; payload=json.load(urllib.request.urlopen('http://127.0.0.1:8080/v3/decision-twin?as_of=2026-06-30&week_start=2026-07-06', timeout=10)); assert payload['metadata']['version'] == '3.1.0'; assert len(payload['coverage_plan']['entries']) == 8"; then
              exit 0
            fi
            sleep 2
          done
          docker logs wallet-twin-smoke
          exit 1
      - if: always()
        run: docker rm --force wallet-twin-smoke || true
      - uses: anchore/sbom-action@v0
        with: { image: "wallet-twin:${{ github.sha }}", format: spdx-json, output-file: sbom.spdx.json }
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: "wallet-twin:${{ github.sha }}"
          severity: "CRITICAL,HIGH"
          exit-code: "1"
          ignore-unfixed: true
      # Bank CI must additionally sign and attest the promoted artifact.
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
