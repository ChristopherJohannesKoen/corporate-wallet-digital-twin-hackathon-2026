receivers:
  otlp:
    protocols:
      grpc: {}
      http: {}
processors:
  memory_limiter: {check_interval: 1s, limit_mib: 256, spike_limit_mib: 64}
  batch: {}
  attributes/redact:
    actions:
      - {key: client.name, action: delete}
      - {key: user.email, action: delete}
      - {key: document.content, action: delete}
exporters:
  debug: {verbosity: basic}
service:
  pipelines:
    traces: {receivers: [otlp], processors: [memory_limiter, attributes/redact, batch], exporters: [debug]}
    metrics: {receivers: [otlp], processors: [memory_limiter, batch], exporters: [debug]}
    logs: {receivers: [otlp], processors: [memory_limiter, attributes/redact, batch], exporters: [debug]}
