version: 1
cluster: wallet-twin
defaults:
  partitions: 12
  replication_factor: 3
  min_insync_replicas: 2
  cleanup_policy: delete
  retention_ms: 31536000000
topics:
  # V3.1 domain topics: event type is carried in the versioned envelope so the
  # platform does not proliferate one topic per business event.
  - { name: wallet-twin.business-twin.v1, partitions: 24 }
  - { name: wallet-twin.decision.v1, partitions: 24 }
  - { name: wallet-twin.client-learning.v1 }
  - { name: wallet-twin.audit.v1, partitions: 24 }
  # V3.2 promotion topic. Separate from the four above because promotion is a
  # governance concern, and routing it onto an existing topic would make every
  # current consumer filter events it has no interest in. Compacted retention
  # is deliberately NOT used: the promotion history is the audit trail, and a
  # superseded gate evaluation is evidence of how the position changed.
  - { name: wallet-twin.promotion.v1 }
  - { name: wallet.eligibility-recorded.v1 }
  - { name: wallet.recommendation-assigned.v1 }
  - { name: wallet.recommendation-displayed.v1 }
  - { name: wallet.recommendation-opened.v1 }
  - { name: wallet.recommendation-dismissed.v1 }
  - { name: wallet.banker-action-recorded.v1 }
  - { name: wallet.pipeline-milestone-recorded.v1 }
  - { name: wallet.outcome-recorded.v1 }
  - { name: wallet.evidence-approved.v1 }
  - { name: wallet.access-decision-logged.v1, partitions: 24 }
  - { name: wallet.shadow-wallet-reconstructed.v1 }
  - { name: wallet.leakage-signal-published.v1 }
  - { name: wallet.action-portfolio-selected.v1 }
  - { name: wallet.evidence-acquisition-approved.v1 }
  - { name: wallet.decision-brief-compiled.v1 }
dead_letter_topics:
  - { name: wallet.contract-quarantine.v1, retention_ms: 7776000000 }
  - { name: wallet.integration-dead-letter.v1, retention_ms: 7776000000 }
