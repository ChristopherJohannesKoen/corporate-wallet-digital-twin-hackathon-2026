apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: wallet-default-deny }
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: wallet-approved-egress }
spec:
  podSelector:
    matchExpressions:
      - { key: app.kubernetes.io/name, operator: Exists }
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: { wallet-twin/approved-dependency: "true" }
      ports:
        - { protocol: TCP, port: 443 }
        - { protocol: TCP, port: 5432 }
        - { protocol: TCP, port: 9098 }
